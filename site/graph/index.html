<style>
  :root {
    --bg: #0f0f1a; --panel: #1a1a2e; --border: #2a2a4e; --input-border: #3a3a5e;

    --neighbor-border: #333; --node-label: #ffffff;
  }
  [data-theme="light"] {
    --bg: #ffffff; --panel: #f8f9fa; --border: #d9dee5; --input-border: #c3cad4;
    --text: #222222; --text-2: #666666; --text-3: #333333; --muted: #888888; --count: #777777;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #graph { flex: 1; }
  #sidebar { width: 280px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #search-wrap { padding: 12px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; background: var(--bg); border: 1px solid var(--input-border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #4E79A7; }
  #search-results { max-height: 140px; overflow-y: auto; padding: 4px 12px; border-bottom: 1px solid var(--border); display: none; }
  .search-item { padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-item:hover { background: var(--border); }
  #info-panel { padding: 14px; border-bottom: 1px solid var(--border); min-height: 140px; }
  #info-panel h3 { font-size: 13px; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #info-content { font-size: 13px; color: var(--text-3); line-height: 1.6; }
  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: var(--text); }
  #info-content .empty { color: var(--muted); font-style: italic; }
  .neighbor-link { display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--neighbor-border); }
  .neighbor-link:hover { background: var(--border); }
  #neighbors-list { max-height: 160px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: var(--text-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .legend-item:hover { background: var(--border); padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: var(--count); font-size: 11px; }
  #stats { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  #legend-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0; }
  #legend-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text-2); user-select: none; }
  #legend-controls label:hover { color: var(--text); }
  .legend-cb, #select-all-cb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid var(--input-border); border-radius: 3px; background: var(--bg); cursor: pointer; position: relative; flex-shrink: 0; }
  .legend-cb:checked, #select-all-cb:checked { background: #4E79A7; border-color: #4E79A7; }
  .legend-cb:checked::after, #select-all-cb:checked::after { content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  #select-all-cb:indeterminate { background: #4E79A7; border-color: #4E79A7; }
  #select-all-cb:indeterminate::after { content: ''; position: absolute; left: 2px; top: 5px; width: 8px; height: 2px; background: #fff; border: none; transform: none; }
  #theme-wrap { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #theme-wrap button { flex: 1; background: var(--bg); color: var(--text-2); border: 1px solid var(--input-border); border-radius: 4px; padding: 3px 0; font-size: 11px; cursor: pointer; }
  #theme-wrap button:hover { color: var(--text); }
  #theme-wrap button[aria-pressed="true"] { background: #4E79A7; border-color: #4E79A7; color: #fff; }
</style>
<script id="graphify-theme-init">
// Apply the saved theme before first paint (#3894). No saved choice keeps the
// historical dark look; "system" follows prefers-color-scheme.
(function () {
  var pref = null;
  try { pref = localStorage.getItem('graphify-theme'); } catch (e) {}
  var t = pref === 'light' ? 'light'
    : pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light'
    : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

// HTML-escape helper — prevents XSS when injecting graph data into innerHTML
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build vis datasets
const nodesDS = new vis.DataSet(RAW_NODES.map((n, i) => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  // Fermat/golden-angle spiral seed positions (#3699): spreading nodes out
  // before physics runs keeps avoidOverlap from computing near-zero-distance
  // repulsion that blows the BarnesHut recursion into a stack overflow on large
  // graphs. `i` is the map index — physics still settles small graphs identically.
  x: 30 * Math.sqrt(i) * Math.cos(i * 2.4),
  y: 30 * Math.sqrt(i) * Math.sin(i * 2.4),
  community: n.community, community_name: n.community_name,
  source_file: n.source_file, file_type: n.file_type, degree: n.degree,
  member_count: n.member_count,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: e.color,
  arrows: { to: { enabled: true, scaleFactor: 0.5 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.08,
      damping: 0.4,
      avoidOverlap: 0.8,
    },
    stabilization: { iterations: 200, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: { shape: 'dot', borderWidth: 1.5 },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
});

// Theme toggle (#3894): Light / Dark / System, persisted in localStorage.
const THEME_KEY = 'graphify-theme';
const themeMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
let themeLabelColor = '#ffffff';  // matches the per-node font color set in Python
function themePref() {
  let p = null;
  try { p = localStorage.getItem(THEME_KEY); } catch (e) {}
  return (p === 'light' || p === 'dark' || p === 'system') ? p : null;
}
function applyTheme(pref) {
  const t = pref === 'light' ? 'light' : (pref === 'system' && themeMQ && themeMQ.matches) ? 'light' : 'dark';
  const root = document.documentElement;
  if (!root) return;
  root.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-choice]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.themeChoice === (pref || 'dark')));
  });
  const labelColor = getComputedStyle(root).getPropertyValue('--node-label').trim();
  if (labelColor && labelColor !== themeLabelColor) {
    themeLabelColor = labelColor;
    nodesDS.update(nodesDS.get().map(n => ({ id: n.id, font: Object.assign({}, n.font, { color: labelColor }) })));
  }
}
document.querySelectorAll('[data-theme-choice]').forEach(b => {
  b.addEventListener('click', () => {
    const pref = b.dataset.themeChoice;
    try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
    applyTheme(pref);
  });
});
if (themeMQ) {
  const onSchemeChange = () => { if (themePref() === 'system') applyTheme('system'); };
  if (themeMQ.addEventListener) themeMQ.addEventListener('change', onSchemeChange);
  else if (themeMQ.addListener) themeMQ.addListener(onSchemeChange);
}
applyTheme(themePref());

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

-detecting.html", "t": "dl-object-detecting"}, "dl_object_tracking_generate_tfrecord": {"h": "../wiki/dl-object-tracking.html", "t": "dl-object-tracking"}, "dl_tesseract_main": {"h": "../wiki/dl-tesseract.html", "t": "dl-tesseract"}, "concept_cnn": {"h": "../wiki/dl-data-training.html", "t": "dl-data-training"}, "concept_keras": {"h": "../wiki/dl-data-training.html", "t": "dl-data-training"}, "concept_kim_donggi": {"h": "../wiki/index.html", "t": "index"}, "concept_maven": {"h": "../wiki/spring-ai.html", "t": "spring-ai"}, "concept_opencv": {"h": "../wiki/dl-object-detecting.html", "t": "dl-object-detecting"}, "concept_python": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_rag": {"h": "../wiki/spring-ai.html", "t": "spring-ai"}, "concept_spring_ai": {"h": "../wiki/spring-ai.html", "t": "spring-ai"}, "concept_ssd_detector": {"h": "../wiki/dl-object-tracking.html", "t": "dl-object-tracking"}, "concept_tensorflow": {"h": "../wiki/dl-object-detecting.html", "t": "dl-object-detecting"}, "concept_tesseract": {"h": "../wiki/dl-tesseract.html", "t": "dl-tesseract"}, "concept_tf_object_detection_api": {"h": "../wiki/dl-object-tracking.html", "t": "dl-object-tracking"}, "concept_tfrecord": {"h": "../wiki/dl-object-tracking.html", "t": "dl-object-tracking"}, "concept_yolo_v3": {"h": "../wiki/dl-object-detecting.html", "t": "dl-object-detecting"}, "dl_data_training_dl_data_training": {"r": "train_car.py 한 파일에 5단 Conv2D·MaxPool·Dropout CNN과 3분류 softmax, ImageDataGenerator 폴더 입력(128x128)을 담은 일회성 실험. 60 epoch 학습에 그래프 x축은 30개라 곡선 해석이 흐려진다.", "h": "../wiki/dl-data-training.html", "t": "dl-data-training"}, "dl_object_detecting_dl_object_detecting": {"r": "OpenCV로 프레임을 416x416 정규화해 Keras YOLO.predict에 넘기는 데모. 동영상 EOF·열기 실패 시 같은 파일을 계속 다시 열어 루프가 끝나지 않고 캡처 해제가 없다(P2). 외부 알고리즘이므로 YOLO 자체 개발 성과로 쓰지 않는다.", "h": "../wiki/dl-object-detecting.html", "t": "dl-object-detecting"}, "dl_object_tracking_dl_object_tracking": {"r": "TensorFlow Object Counting API 기반 예제로 아직 구성 중. generate_tfrecord.py가 motorcycle·car·bus·truck 네 라벨 밖 값에 None을 돌려줘 잘못된 라벨이 조용히 넘어갈 수 있다(P2).", "h": "../wiki/dl-object-tracking.html", "t": "dl-object-tracking"}, "dl_tesseract_dl_tesseract": {"r": "GaussianBlur·회색 변환·Canny·morphology로 후보 윤곽을 만들고 사각형의 회전·면적·종횡비를 검사해 Tesseract로 읽는 단일 이미지 GUI 실험. cv2.findContours 반환값 3개 형태라 OpenCV 버전에 민감하다.", "h": "../wiki/dl-tesseract.html", "t": "dl-tesseract"}, "flask_leaflet_flask_leaflet": {"r": "app.py가 /page/wind·heatDraw·cluster·cctv·3d를 Jinja 템플릿으로 보내는 얇은 데모 계층. debug 모드로 모든 인터페이스에 바인딩하고 지도 키가 클라이언트 코드에 있어 P1·P2 과제.", "h": "../wiki/flask-leaflet.html", "t": "flask-leaflet"}, "index_index": {"r": "김동기의 공개 GitHub 저장소를 Markdown 문서로 정리한 중앙 위키. 원본 링크는 확인한 커밋에 고정. 관계 지도는 사람이 연결한 것이며 Graphify 자동 추출이 아니다.", "h": "../wiki/index.html", "t": "index"}, "kdkrkwhr_kdkrkwhr": {"r": "README 하나로 선택 프로젝트 세 개와 이력서·블로그 링크를 제시하는 입구. 링크·소개는 수동 갱신이라 오래된 링크가 남을 수 있다(P3).", "h": "../wiki/kdkrkwhr.html", "t": "kdkrkwhr"}, "local_queue_local_queue": {"r": "AGENT HUB의 engine.py가 SQLite에 작업을 기록·상태 관리, adapters.py가 설치된 CLI를 서브프로세스로 호출, 결과를 DB에 남긴 뒤 채널 전달.", "h": "../wiki/local-queue.html", "t": "local-queue"}, "repositories_repositories": {"r": "2026-10-27 확인한 kdkrkwhr 공개 저장소 28개(non-fork 25, fork 3)의 문서 범위. 정적 분석은 실행·개인 기여 검증이 아니다.", "h": "../wiki/repositories.html", "t": "repositories"}, "spring_ai_spring_ai": {"r": "spring-projects/spring-ai의 fork. 루트 pom.xml은 BOM·모델·벡터 저장소·자동 설정 모듈의 Maven parent. 평가 4축 모두 미확인(upstream 설계).", "h": "../wiki/spring-ai.html", "t": "spring-ai"}, "concept_hardcoded_paths_hyperparams": {"r": "데이터 위치·epoch·모델 크기·라벨 ID가 스크립트 안에 있어 다른 데이터셋을 쓰려면 원본을 편집해야 한다. 입력값으로 분리하면 해석 오류와 수동 변경이 줄어든다.", "h": "../wiki/dl-data-training.html", "t": "dl-data-training"}, "concept_opencv_version_coupling": {"r": "findContours의 반환값 개수가 버전에 따라 달라 README 환경 밖 최신 설치에서 같은 동작을 보장하지 않는다. 의존성 버전과 입력 예제를 기록해야 한다.", "h": "../wiki/dl-tesseract.html", "t": "dl-tesseract"}, "kdkrkwhr_profile_entry_vs_wiki": {"r": "README의 기술 이름 목록을 특정 프로젝트에서 사용했다는 증거로 자동 연결하지 않는다.", "h": "../wiki/kdkrkwhr.html", "t": "kdkrkwhr"}, "local_queue_sqlite_work_queue": {"r": "웹 요청을 곧바로 모델 응답으로 취급하지 않고 작업 상태를 SQLite에 기록한 뒤 CLI 서브프로세스로 실행한다. 선택 이유·처리량·운영 효과는 확인한 파일에 없다.", "h": "../wiki/local-queue.html", "t": "local-queue"}, "repositories_evaluation_rubric": {"r": "구조·설계, 구현 품질, 운영 준비, 유지보수 4축. P1은 공개 실행 전 우선, P2는 다음 변경 때, P3는 기록 차원. 총점·순위는 매기지 않고 fork upstream 구현은 소유자 기여로 평가하지 않는다.", "h": "../wiki/repositories.html", "t": "repositories"}, "repositories_static_not_execution": {"r": "non-fork도 단독 저작을 뜻하지 않으며 fork는 기본 브랜치 비교만으로 외부 PR 기여를 배제할 수 없다.", "h": "../wiki/repositories.html", "t": "repositories"}, "spring_ai_no_fork_commits": {"r": "기본 브랜치 비교 스냅샷일 뿐 다른 브랜치·외부 PR 기여를 조사한 결과가 아니며, Spring AI를 실제 프로젝트에 적용했다는 근거도 없다. P3: 활용 시 upstream 커밋과 개인 변경분 기록.", "h": "../wiki/spring-ai.html", "t": "spring-ai"}, "flask_leaflet_cctvmap_js": {"h": "../wiki/flask-leaflet.html", "t": "flask-leaflet"}, "concept_geojson": {"h": "../wiki/flask-leaflet.html", "t": "flask-leaflet"}, "concept_leaflet": {"h": "../wiki/flask-leaflet.html", "t": "flask-leaflet"}, "concept_api_key_in_localstorage_risk": {"r": "선택 기능의 API 키와 생활 설정이 같은 설정 객체에 장기 저장되어 공유 기기·동일 오리진 스크립트 문제에 취약하다. 민감 설정과 일반 UI 설정을 분리해야 한다.", "h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_client_side_api_key_exposure": {"r": "지도 서비스 키를 브라우저 스크립트에 직접 두면 사용 범위를 통제하기 어렵다. 키 제한·교체 정책과 타일 HTTPS를 정해야 한다.", "h": "../wiki/flask-leaflet.html", "t": "flask-leaflet"}, "agentradio_coral_multi_agent": {"h": "../wiki/AgentRadio.html", "t": "AgentRadio"}, "agentradio_resume_guard": {"h": "../wiki/AgentRadio.html", "t": "AgentRadio"}, "hermes_agent_sandbox_scripts": {"h": "../wiki/hermes-agent.html", "t": "hermes-agent"}, "hermes_env_bootstrap_sh": {"r": "경로를 sed 치환식에 그대로 넣고 doctor가 경로 포함 문자열을 eval로 실행해 특수문자 경로에서 깨질 수 있다(P2). 문자열 대체 API와 eval 없는 파일 검사로 바꿔야 한다.", "h": "../wiki/hermes-env.html", "t": "hermes-env"}, "hermes_env_config_template": {"h": "../wiki/hermes-env.html", "t": "hermes-env"}, "hermes_env_doctor": {"r": "기능 통합 테스트가 아니라 디렉터리·CLI·config·스킬·.env.local·역할 config 존재만 점검하는 로컬 파일 상태 확인이다.", "h": "../wiki/hermes-env.html", "t": "hermes-env"}, "concept_bash_shell": {"h": "../wiki/hermes-env.html", "t": "hermes-env"}, "concept_cli_subprocess": {"h": "../wiki/local-queue.html", "t": "local-queue"}, "concept_coral": {"h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "concept_coral_protocol": {"h": "../wiki/AgentRadio.html", "t": "AgentRadio"}, "concept_hermes": {"h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "concept_jsonl": {"h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "concept_localstorage": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_nousresearch": {"h": "../wiki/hermes-agent.html", "t": "hermes-agent"}, "concept_npm": {"h": "../wiki/hermes-agent.html", "t": "hermes-agent"}, "concept_ssot": {"h": "../wiki/hermes-env.html", "t": "hermes-env"}, "concept_threadinghttpserver": {"h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_hubstore": {"r": "hermes-team-hub.logs.v1 키로 localStorage에 기록을 추가·조회·삭제. 브라우저별 로컬 상태이며 팀 공유 DB가 아니다.", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_jsonl_model": {"r": "역할 검사·시각 채움 후 activities.jsonl에 기록, 날짜·역할·카드·태그 필터로 읽음. Pages의 localStorage와 별도 저장 방식.", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_local_app": {"r": "ThreadingHTTPServer를 루프백에 바인딩. /api/kanban은 hermes kanban list --json 호출 후 5초 메모리 캐시, /api/agents는 SOUL 문서, /api/coral·/api/logs 조회 경로.", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_team_hub_cli": {"h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "local_queue_adapters": {"h": "../wiki/local-queue.html", "t": "local-queue"}, "agentradio_agentradio": {"r": "Coral-Protocol/AgentRadio upstream 연구 코드의 fork로, 독자 커밋이 확인되지 않아 개인 기여로 귀속하지 않는다.", "h": "../wiki/AgentRadio.html", "t": "AgentRadio"}, "hermes_agent_hermes_agent": {"r": "NousResearch/hermes-agent fork. 기본 브랜치가 upstream보다 앞선 커밋 2개: 미태그 fork에서 release tag를 얻는 CI 변경과 sandbox 안 npm TLS 프록시 CA 신뢰 변경. upstream 전체 기능을 계정 작업으로 평가하지 않는다.", "h": "../wiki/hermes-agent.html", "t": "hermes-agent"}, "hermes_env_conventions": {"r": "코드 저장소·SSoT·보고서·시크릿 파일 위치 구분은 도구가 강제하는 보안 경계가 아니라 사용자가 유지할 운영 규칙이다.", "h": "../wiki/hermes-env.html", "t": "hermes-env"}, "hermes_env_hermes_env": {"r": "제품 코드·개인 메모리 복사본이 아니라 Hermes 작업 환경의 디렉터리 구조·프로필 템플릿·스킬·운영 규칙을 다른 머신에 배치하는 부트스트랩. 프로젝트 코드·SSoT 본문·시크릿 값은 포함하지 않는다.", "h": "../wiki/hermes-env.html", "t": "hermes-env"}, "hermes_team_hub_hermes_team_hub": {"r": "PM·Dev·Infra·QA·Ops 역할별 입력 화면과 팀 로그. 평가: 구조 양호, 구현 품질 위험(GET 경로의 상태 변경 명령·모든 Origin 허용), 운영·유지보수 보완 필요.", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "concept_fork_attribution_boundary": {"r": "공개 compare에서 fork가 upstream보다 앞선 커밋이 없거나 소수인 경우, upstream 기능·수치를 계정 소유자의 성과로 귀속하지 않는다.", "h": "../wiki/AgentRadio.html", "t": "AgentRadio"}, "concept_preserve_existing_config_idempotency": {"r": "기존 config.yaml·역할 config·.env.local은 건너뛰지만 --with-souls는 SOUL 덮어쓰기를 명시 선택하고 스킬은 cp -r로 복사한다. README의 멱등 설명을 모든 파일 불변으로 확대하지 않는다.", "h": "../wiki/hermes-env.html", "t": "hermes-env"}, "concept_sandbox_ca_trust_isolation": {"r": "TLS 프록시 CA를 격리 환경(sandbox) 안에서만 npm에 신뢰시켜 호스트 전체 신뢰 설정을 바꾸지 않는다. 실제 격리·설치 결과는 미확인.", "h": "../wiki/hermes-agent.html", "t": "hermes-agent"}, "hermes_team_hub_cli_allowlist": {"r": "CLI 명령을 허용 목록으로 제한하지만 목록에 상태 변경 명령이 있고 GET 경로에서 실행되므로 읽기 전용 조회와 분리해야 한다(P1).", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_get_state_change_risk": {"r": "루프백 서비스라도 다른 웹 페이지가 요청을 유도할 수 있으므로 상태 변경 명령을 GET에서 분리하고 요청 출처·확인 경계를 둬야 한다.", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_shared_filter_state": {"r": "역할별 검색 입력은 따로 저장하지만 탭 전환 후 필터가 섞일 수 있다는 코드상 판단(실행 확인 아님, P2).", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "hermes_team_hub_static_demo_vs_local_runtime": {"r": "같은 이름의 허브라도 Pages는 브라우저 localStorage 기록, 로컬 서버는 Hermes 칸반·프로필·Coral 상태를 읽으므로 두 경로를 합쳐 실시간 서비스로 설명하지 않는다.", "h": "../wiki/hermes-team-hub.html", "t": "hermes-team-hub"}, "local_queue_local_not_offline": {"r": "큐·웹 서버가 로컬이어도 CLI는 로그인된 외부 모델 서비스로 작업을 보낼 수 있다. SECURITY.md는 원격 인증 없는 로컬 UI의 공개 노출을 피하라고 설명.", "h": "../wiki/local-queue.html", "t": "local-queue"}, "attendance_pwa_app_js": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "attendance_pwa_commute_time_js": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "attendance_pwa_config_js": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "attendance_pwa_news_brief_js": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "attendance_pwa_sw_js": {"r": "HTML·JS·CSS·날씨·뉴스 요청은 네트워크 우선·캐시 대체, 그 밖의 GET은 캐시 우선으로 분리한다.", "h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "hermes_agent_area_connectpanel": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "hermes_agent_area_main_js": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "hermes_agent_area_mock": {"r": "완료 건수 [2,2,1]과 평균 속도는 mock 자료이지 개인 Hermes 실적이 아니다.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "hermes_agent_area_officescene": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "hermes_agent_area_server_main": {"r": "한 파일이 hermes profile list 파싱, 칸반 SQLite·게이트웨이 로그 해석, /api/desk-brief, /api/file-preview, /ws 방송을 모두 맡는다. 5초 폴링·0.05초 tick 보간. 기본 경로가 특정 개인 PC이고 cron 식별자 3개가 상수.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "hermes_agent_area_test_gateway_busy": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "hermes_agent_install_e2e_workflow": {"h": "../wiki/hermes-agent.html", "t": "hermes-agent"}, "concept_discord": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_fastapi": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_github_actions": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_google_sheets": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_phaser": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_pwa": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_role_profiles_pm_dev_infra_qa_ops": {"h": "../wiki/hermes-env.html", "t": "hermes-env"}, "concept_service_worker": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_vite": {"h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "attendance_pwa_attendance_pwa": {"r": "서버 없이 브라우저 localStorage에 출퇴근 기록을 두고 8시간 근무+1시간 점심으로 퇴근 시각을 계산한다. 선택형 API 키가 같은 설정 객체에 장기 보관되는 점이 P1 과제.", "h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "hermes_agent_area_hermes_agent_area": {"r": "여러 로컬 Hermes 에이전트의 활동을 픽셀아트 사무실 한 장면에서 살펴보기 위해 Phaser 3·Vite 프런트와 FastAPI·WebSocket 서버를 두었다. 공개 Pages 화면은 mock이며 실시간 개인 자료에 자동 연결되지 않는다.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_debug_bind_all_interfaces_risk": {"r": "공개 환경에서 debug=True로 0.0.0.0에 바인딩하면 개발용 디버거가 노출된다. 외부 노출 설정에서 debug를 끄고 바인딩을 제한해야 한다.", "h": "../wiki/flask-leaflet.html", "t": "flask-leaflet"}, "concept_desk_brief_optional_pwa_fallback": {"r": "날씨·뉴스는 출퇴근 PWA 데이터 폴더의 JSON을 먼저 시도하고 없으면 Hermes cron 출력으로 대체한다. PWA 파일은 선택적 입력이라 설치·실행 의존성이 아니다.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_display_name_resolution_order": {"r": "area.json/office.json 설정값 → Discord 연결 이름 → SOUL.md 이름 → CLI 프로필 alias → 프로필 ID 순. default 프로필의 자료 루트는 Hermes 홈 자체다.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_local_first_not_offline": {"r": "CLI 인증을 이용하므로 프롬프트와 작업 내용이 모델 서비스로 전송될 수 있다. 원격 사용자 인증이 없어 공개 프록시 노출을 피해야 하며 읽기 전용 CLI 설정도 OS 샌드박스가 아니다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_local_record_optional_network_boundary": {"r": "중심 기록은 브라우저 로컬이지만 공인 IP 조회·Google Sheet 전송·통근·뉴스는 설정과 사용자 동작에 따라 외부 요청을 보낸다. 둘을 동일하게 '완전 오프라인'으로 설명하지 않는다.", "h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_local_websocket_blocked_on_https": {"r": "혼합 콘텐츠 제약으로 HTTPS Pages에서 로컬 ws://가 막히면 OfficeScene은 연결을 건너뛰고 연결 끊김용 mock 칸반을 쓴다. 로컬 프런트엔드나 별도 wss://로 우회를 안내한다.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_loopback_csrf_boundary": {"r": "로컬 도구 목적에 맞게 루프백 접근만 허용하고 Host·Origin·CSRF 토큰을 검사한다. 다중 사용자 서비스로 확장하려면 인증·권한 경계를 새로 설계해야 한다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_path_prefix_check_weakness": {"r": "/api/file-preview의 허용 경로 검사가 정규화 경로의 문자열 접두사만 비교해 실제 포함 관계와 달라 루트 밖 텍스트를 읽을 수 있다. 경로 객체 기준 포함 검사로 고쳐야 한다(P1).", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_public_demo_local_server_boundary": {"r": "HTTPS Pages에서는 mock 자료로 장면을 보여 주고, 실제 프로필·칸반·로그는 루프백 로컬 서버에 연결했을 때만 흐른다. 데모 수치를 개인 작업 성과로 읽지 않는다.", "h": "../wiki/hermes-agent-area.html", "t": "hermes-agent-area"}, "concept_readme_vs_implementation_gap": {"r": "문서가 말하는 큐·알림·저장 방식이 코드와 다르면 잘못된 운영 가정을 낳는다. 문서와 구현 경계를 갱신해야 한다.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "airport_parking_kakaoskillrestcontroller": {"r": "Redis 수집 결과 대신 classpath test.json을 반환하므로 실시간 주차 조회와 연결됐다고 설명하지 않는다.", "h": "../wiki/airport-parking.html", "t": "airport-parking"}, "auction_spot_auctionlifecycleservice": {"r": "대기 경매를 생성 시각순으로 queueOrder를 매기고 활성 경매가 없으면 다음 건을 5분 종료로 시작한다. 종료 시 입찰이 없으면 유찰, 있으면 낙찰·채팅방 생성.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_bidcommandservice": {"r": "경매 행을 잠가 활성·본인 물품·선두 입찰자 여부를 검사하고 500원 단위 증액만 저장한다. 종료 60초 전 입찰은 종료 연장, 즉시 구매가 도달 시 낙찰·채팅방 생성.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_fcmnotificationservice": {"h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_front_app_router": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "auction_spot_front_auctionrepository": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "auction_spot_front_auctionwsclient": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "auction_spot_front_dioclient": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "auction_spot_front_storagerepository": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "auction_spot_localfilewebconfig": {"h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_localimagestorageservice": {"r": "빈 파일·허용 유형(JPEG·PNG·WebP·GIF)·최대 크기를 검사한 뒤 UUID 이름으로 items 디렉터리에 복사한다.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_localuploadcontroller": {"h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_redisauctioncache": {"h": "../wiki/auction-spot.html", "t": "auction-spot"}, "flutter_profile_main": {"h": "../wiki/flutter-profile.html", "t": "flutter-profile"}, "flutter_profile_portfolio": {"h": "../wiki/flutter-profile.html", "t": "flutter-profile"}, "concept_devfolio": {"h": "../wiki/flutter-profile.html", "t": "flutter-profile"}, "concept_dio": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "concept_firebase": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "concept_flutter": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "concept_go_router": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "concept_mysql": {"h": "../wiki/auction-spot.html", "t": "auction-spot"}, "concept_provider_flutter": {"h": "../wiki/flutter-profile.html", "t": "flutter-profile"}, "concept_responsive_builder": {"h": "../wiki/flutter-profile.html", "t": "flutter-profile"}, "concept_riverpod": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "concept_stomp": {"h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "concept_websocket": {"h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_auction_spot": {"r": "동네 기반 실시간 경매 백엔드. README는 Redis sorted-set 큐를 말하지만 실제 대기 순서는 DB queueOrder이고 Redis는 선택적 값 캐시다. 위치 조회 실패를 고정 지역으로 대체하는 점이 P1.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "auction_spot_front_auction_spot_front": {"r": "루트 README는 기본 Flutter 문구이고 실제 구현은 lib/와 pubspec.yaml에서 확인. 401 처리에서 같은 Dio 인스턴스로 토큰 갱신을 보내 재진입 가능성이 있고 본문 로깅이 모드 조건 없이 등록됨(P1).", "h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "flutter_profile_flutter_profile": {"r": "DevFolio를 참고한 Dart·Flutter 프로필 앱. 저장 테마를 비동기로 읽지만 setState가 없고 Provider에 별도 ThemeProvider를 만들어 첫 화면이 저장 테마를 반영하지 못할 수 있다(P2).", "h": "../wiki/flutter-profile.html", "t": "flutter-profile"}, "concept_row_lock_bid_validation": {"r": "동시 입찰 경쟁에서 상태·금액 규칙을 한 트랜잭션 안의 행 잠금으로 검사해 일관성을 지킨다. 처리량은 검증되지 않았다.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "concept_token_refresh_reentrancy": {"r": "401 인터셉터가 같은 Dio 인스턴스로 리프레시를 보내면 갱신 요청도 같은 오류 인터셉터를 통과해 반복 요청이 가능하다. 갱신 전용 클라이언트 또는 경로 제외·동시 요청 조정이 필요하다.", "h": "../wiki/auction-spot-front.html", "t": "auction-spot-front"}, "agent_drift_guard_driftguardbuffer": {"r": "메시지를 잠금 아래 목록에 쌓고 단계 종료 시 목록을 교체해 방출한다. 큐 상한이 없어 장기 실행 시 메모리·주입 문맥이 커질 수 있다.", "h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "agent_drift_guard_format_injection": {"h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "agent_drift_guard_inject_at_boundary": {"h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "agent_drift_guard_sessionguards": {"h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "agent_hub_adapters": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_engine": {"r": "결과를 먼저 DB에 저장한 뒤 채널로 전달하고 메시지 식별자로 중복 전송을 막는다. 재시작으로 끊긴 실행은 실패로 기록해 검토 후 재시도한다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_manual_discussion": {"r": "무제한 상호 호출 대신 호스트가 두 회차만 제어하고, 실행 전후 작업 사본 지문을 검사해 일부 실패 시 토론을 멈춘다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_manual_workspace": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_pipeline": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_publication": {"r": "preview가 Git 상태·기준 커밋·패치·브랜치·원격을 검사해 토큰을 만들고, execute는 명시적 확인값과 유효 토큰이 있을 때만 apply·commit·push한다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_server": {"r": "127.0.0.1 바인딩, Host·Origin·CSRF·요청 크기 제한. 하나의 do_POST 분기가 설정·토론·파이프라인·투표·메시지를 모두 처리해 변경 범위가 넓다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_storage": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "agent_hub_voting": {"r": "공개 전 선택과 근거를 API에서 숨기고 전원 처리 또는 마감 시 공개한다. 결과는 판단 자료이지 실행 권한 승인이 아니다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_claude_code": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_codex_cli": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_cursor_agent": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_sqlite": {"h": "../wiki/agent-hub.html", "t": "agent-hub"}, "local_queue_engine": {"h": "../wiki/local-queue.html", "t": "local-queue"}, "local_queue_storage": {"r": "설정, DB, 로그, 작업 사본, 산출물 경로를 분리.", "h": "../wiki/local-queue.html", "t": "local-queue"}, "agent_drift_guard_agent_drift_guard": {"r": "Hermes에 AIAgent.steer()와 busy 입력 경로가 이미 있어 별도 0-turn 메커니즘 개발을 중단(SHELVED)했다.", "h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "agent_hub_agent_hub": {"r": "자체 모델·인증 서버가 아니라 설치·로그인된 Claude Code·Codex CLI·Cursor Agent를 로컬에서 호출하는 협업 허브. 0.3.0 Alpha, Windows 중심 검증.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_step_boundary_message_buffering": {"r": "다른 에이전트의 메시지가 추론·도구 호출 중간에 도착하면 흐름을 흐트러뜨린다는 가설에서, 메시지를 단계 경계까지 보류했다가 도구 결과 뒤에 덧붙인다. 새 LLM 턴을 열지 않는 것은 런타임 책임이다.", "h": "../wiki/agent-drift-guard.html", "t": "agent-drift-guard"}, "concept_workspace_copy_export_boundary": {"r": "에이전트는 사본·기준 ZIP·SHA-256 지문 위에서 작업하고 export는 패치·보고서를 만들 뿐 원본 적용·commit·push가 아니다. 웹 파이프라인만 별도 확인 동선(Publication)을 통해 반영한다.", "h": "../wiki/agent-hub.html", "t": "agent-hub"}, "concept_anna_aps": {"h": "../wiki/notebuddy.html", "t": "notebuddy"}, "concept_compare_and_set": {"h": "../wiki/notebuddy.html", "t": "notebuddy"}, "concept_indexeddb": {"h": "../wiki/notebuddy.html", "t": "notebuddy"}, "concept_javascript_worker": {"h": "../wiki/notebuddy.html", "t": "notebuddy"}, "concept_pyodide": {"h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_anna_game_worker": {"r": "허용 명령을 확인하고 게임 코어의 transition을 호출.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_evolution": {"r": "다음 단계의 레벨·돌봄·훈련·산책 조건을 계산하고 진행 중 선택을 먼저 끝내야 하는 상황을 구분. AI 설명은 게임 조건 값과 분리.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_executioncontext": {"r": "전이 계산에 필요한 외부 입력을 호출자가 건네는 의존 경계. ports.py의 ContextMapping·Dependency는 실행 문맥이 없을 때 다른 모듈로 암묵적으로 넘어가 추적이 어려울 수 있다.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_gameapplication": {"r": "저장소에서 상태를 읽고 요청 ID·저장 리비전을 검사, 전이 결과가 바뀌면 리비전을 확인해 교체하고 충돌 시 재시도. 저장소 계약은 load·compare_and_set.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_gameservice_invoke": {"r": "APS 저장값·ETag를 읽고 요청 영수증과 게임 상태를 함께 구성해 조건부로 씀. 기존 행은 ETag 충돌 재시도, 최초 생성은 쓰기 전 재조회만.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_transition": {"r": "기존 상태·명령·실행 문맥을 받아 TransitionResult(결과·다음 상태·변경 여부·이벤트)를 반환. 명령 형식·접근 범위 검사 후 엔진 명령 분배. 파일 저장은 직접 하지 않는다.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_web_store": {"r": "플레이어 상태를 리비전 비교로 갱신, 플레이어·그림 데이터를 별도 키로 관리하고 교체 시 같은 트랜잭션 사용. 웹 구현에 한정.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_web_worker": {"r": "Pyodide를 준비해 Python 코어와 규칙 데이터를 브라우저에 적재, 메시지를 받아 transition을 호출하고 결과·상태·뷰를 JavaScript로 반환.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_notebuddy": {"r": "그림·사진에서 친구를 만들고 돌봄·대화·산책·모험을 이어가는 공개 프로젝트. 평가: 구조·구현 양호, Anna APS 최초 생성 원자성 부재(P1)와 Dependency 암묵적 대체(P2) 보완 필요.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "python_execution_python_execution": {"r": "노트버디에서 Python의 역할은 화면 기술 전체가 아니라 게임 상태 전이 계산이다.", "h": "../wiki/python-execution.html", "t": "python-execution"}, "local_queue_restart_dedupe": {"r": "끊긴 실행을 실패 상태로 표시하고 채널 메시지의 작업 식별자로 이미 전달된 응답을 재전송하지 않는다. 재검토 가능한 상태를 남기는 경로이지 모든 오류 회복 보장은 아니다.", "h": "../wiki/local-queue.html", "t": "local-queue"}, "notebuddy_aps_first_create_race": {"r": "기존 행의 ETag 보호와 다른 경계. 쓰기 직전 재조회로 경쟁 가능성만 줄이므로 GameApplication의 계약을 Anna 구현에 그대로 적용했다고 읽으면 안 된다(P1).", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_transition_storage_separation": {"r": "공통 규칙 계산과 호스트별 저장 책임을 분리하고 실행 입력을 주입한다. 설계 이유는 공개 근거로 확정할 수 없다.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "notebuddy_user_chooses_evolution": {"r": "레벨만으로 진화하지 않고 활동 조건을 채운 뒤 사용자가 시점과 세 방향 중 하나를 고른다. AI는 설명·외형 제안만 보탠다.", "h": "../wiki/notebuddy.html", "t": "notebuddy"}, "python_execution_shared_entrypoint": {"r": "브라우저 Worker(Pyodide)와 Anna Worker의 입출력 처리가 같다는 주장이 아니라 진입점(transition)이 같다는 관찰. 웹 저장(IndexedDB)을 Anna 영속화로 일반화하지 않는다.", "h": "../wiki/python-execution.html", "t": "python-execution"}, "concept_graphify": {"h": "../wiki/index.html", "t": "index"}, "concept_markdown": {"h": "../wiki/kdk-knowledge.html", "t": "kdk-knowledge"}, "kdk_knowledge_build_wiki": {"r": "front matter와 본문을 읽어 정적 HTML·Markdown 복사·검색 인덱스·관계 JSON 생성. render_markdown은 제목·평면 목록·링크·코드만 처리하므로 중첩 목록·표는 평문 처리될 수 있다.", "h": "../wiki/kdk-knowledge.html", "t": "kdk-knowledge"}, "kdk_knowledge_validate": {"r": "등록 근거 URL의 저장소·커밋·경로 일치, 공개 여부, 문서 링크·관계 근거를 검사. 의미적 진실은 판정하지 않는다.", "h": "../wiki/kdk-knowledge.html", "t": "kdk-knowledge"}, "maintenance_sources_json": {"r": "공개 가능한 파일 URL을 전체 커밋 SHA로 고정해 등록. 공개 범위 불확실한 경력·성과·개인정보는 등록하지 않는다.", "h": "../wiki/maintenance.html", "t": "maintenance"}, "standards_build_wiki": {"r": "용어 JSON과 템플릿에서 HTML·Markdown을 생성하고 커밋 SHA를 링크에 넣는다. kdk-knowledge의 프로젝트 해설과는 편집 원본·설명 대상이 다르다.", "h": "../wiki/standards.html", "t": "standards"}, "standards_check_docs": {"r": "Markdown 제목·상대 링크·코드 블록 닫힘 검사.", "h": "../wiki/standards.html", "t": "standards"}, "standards_docs_workflow": {"r": "푸시·PR에 문서·위생·용어·위키·검색 검사를 정의. 정적 확인이며 Actions 결과를 재검증한 것은 아니다.", "h": "../wiki/standards.html", "t": "standards"}, "standards_python_profile": {"r": "이름·모듈·테스트 파일 규칙을 다루되 특정 프레임워크·런타임 버전을 필수로 하지 않는다.", "h": "../wiki/standards.html", "t": "standards"}, "kdk_knowledge_kdk_knowledge": {"r": "docs/wiki/*.md 원본에서 HTML·검색 색인·관계 JSON을 빌드하는 저장소. 평가: 구조·운영 양호, 구현 품질(단순 Markdown 파서)·유지보수(사람이 근거·링크·관계 동시 갱신) 보완 필요.", "h": "../wiki/kdk-knowledge.html", "t": "kdk-knowledge"}, "maintenance_maintenance": {"r": "docs/wiki/*.md가 편집 원본, HTML·검색·관계 JSON은 빌드 산출물. 프로젝트 추가 5단계 절차와 지원 Markdown 범위. Graphify 상태 not-run.", "h": "../wiki/maintenance.html", "t": "maintenance"}, "standards_standards": {"r": "공통 원칙·명명·구조 선택, 언어별·프레임워크별 프로필을 구분하는 별도 공개 저장소. 평가: 구조·구현 양호, build_wiki.py가 용어 HTML·그래프 자료·문서 출력을 한 모듈에서 처리해 유지보수 보완 필요(P2).", "h": "../wiki/standards.html", "t": "standards"}, "index_pinned_commit_links": {"r": "원본 저장소에 별도 위키가 없어도 README·코드·설계 문서만으로 기록할 수 있고, 커밋 고정으로 설명과 근거의 시점을 맞춘다.", "h": "../wiki/index.html", "t": "index"}, "kdk_knowledge_source_pinning_vs_commentary": {"r": "공개 산출물 범위를 제한하고 근거의 커밋·경로·공개 여부를 검사하되, 자동 생성은 편집의 대체가 아니다. P2: 미지원 Markdown 구조를 빌드에서 명확히 거부.", "h": "../wiki/kdk-knowledge.html", "t": "kdk-knowledge"}, "maintenance_add_project_procedure": {"r": "저장소 소유만으로 단독 저작을 주장하지 않고, 사실마다 가까운 원본 링크를 두며, build_wiki.py --check·validate.py·unittest를 실행한다. 공개 원본 변경은 해설을 자동 수정하지 않으므로 재대조 필요.", "h": "../wiki/maintenance.html", "t": "maintenance"}, "maintenance_test_existence_vs_success": {"h": "../wiki/maintenance.html", "t": "maintenance"}, "standards_optional_profiles": {"r": "기준 저장소 커밋을 고정한 뒤 필요한 문서를 소비 프로젝트에 배치하고 기존 지침과 충돌을 검토한다. 언어 프로필과 프레임워크 프로필은 각각 선택.", "h": "../wiki/standards.html", "t": "standards"}, "standards_reference_not_adoption": {"r": "노트버디·옥션스팟·AGENT HUB가 어떤 기준을 적용했는지는 프로젝트별 결정 기록과 적용 커밋이 있어야 한다. 기준 저장소의 Graphify 분석이 이 허브의 분석을 대체하지 않는다.", "h": "../wiki/standards.html", "t": "standards"}, "concept_github_pages": {"h": "../wiki/attendance-pwa.html", "t": "attendance-pwa"}, "concept_html_css": {"h": "../wiki/resume.html", mage-storage"}, "image_storage_image_storage": {"r": "옥션스팟 API가 문서의 S3 설계와 달리 로컬 디스크를 쓴다는 README 설명을 Java 파일 세 개로 확인. 결정 이유·성과 근거는 없음.", "h": "../wiki/image-storage.html", "t": "image-storage"}, "concept_local_disk_image_storage": {"r": "설계 문서의 S3와 달리 현재 API는 서버 로컬 디스크에 저장해 여러 인스턴스의 파일 공유를 보장하지 않는다. 변경 이유는 미확인.", "h": "../wiki/auction-spot.html", "t": "auction-spot"}, "image_storage_local_disk_vs_s3": {"r": "MIME 검사만으로 파일 안전성을 확정할 수 없고, 파일 URL의 운영 접근 제어·배포 구성과 S3와 다르게 구현한 이유는 세 파일만으로 확정하지 않는다.", "h": "../wiki/image-storage.html", "t": "image-storage"}};

  h += `<div class="field">${esc(KG_TYPE[n.file_type] || n.file_type || '')} · ${esc(n.community_name || '')}</div>`;
  if (x.r) h += `<div class="field" style="margin-top:6px;padding:8px;border-left:3px solid #4E9F8F;background:rgba(78,159,143,.12);border-radius:4px"><div style="font-size:11px;opacity:.75">추출 요약 (자동)</div>${esc(x.r)}</div>`;
  if (x.h) {
    h += `<div class="field" style="margin-top:6px">${nodeId.startsWith('concept_') ? '처음 언급' : '출처'}: ${esc(x.t || '')}</div>`;
    h += `<div class="field" style="display:flex;gap:6px;margin-top:4px">`
       + `<a href="${esc(x.h)}" style="padding:4px 10px;border-radius:6px;background:#4E9F8F;color:#fff;text-decoration:none;font-size:12px">위키 열기</a>`
       + `<button data-preview="${esc(x.h)}" style="padding:4px 10px;border-radius:6px;border:1px solid #4E9F8F;background:transparent;color:inherit;font-size:12px;cursor:pointer">미리보기</button></div>`;
  }
  const edgeIds = network.getConnectedEdges(nodeId);
  const items = edgeIds.map(eid => {
    const e = edgesDS.get(eid); const other = e.from === nodeId ? e.to : e.from; const nb = nodesDS.get(other);
    const m = /^(\S+)\s*\[(\w+)\]/.exec(e.title || '') || [];
    const tag = `${KG_REL[m[1]] || m[1] || ''}${m[2] ? ' · ' + (KG_CONF[m[2]] || m[2]) : ''}`;
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(other)}">${esc(nb ? nb.label : other)} <small style="opacity:.6">${esc(tag)}</small></span>`;
  }).join('');
  if (items) h += `<div class="field" style="margin-top:8px;color:var(--text-2);font-size:11px">연결 (${edgeIds.length})</div><div id="neighbors-list">${items}</div>`;
  document.getElementById('info-content').innerHTML = h;
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-preview]'); if (b) kgPreview(b.getAttribute('data-preview')); });
(function () {

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Neighbor links use a data attribute + one delegated listener rather than an
// inline onclick. A node id/label sourced from a document or a scraped URL
// (graphify add) can contain a double-quote; dropping the stringified id
// unescaped into a quoted onclick both broke every link and allowed a hostile
// source to inject an event handler into the local report (stored XSS, #1838).
// esc() on data-nid keeps the value inside the attribute; the listener reads it
// back verbatim. Bound to document so it survives the innerHTML rebuild that
// recreates #neighbors-list on each showInfo().
document.addEventListener('click', e => {
  const el = e.target.closest('.neighbor-link');
  if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
});

// Sidebar tooltips reuse vis-network's .vis-tooltip style and 100ms tooltipDelay.
// Names get one only when CSS ellipsis truncates them (the full text is still in
// the DOM); counts always get one, to say what the number is. Text is set with
// textContent only (labels are untrusted). Delegated on document so rows rebuilt
// later (search results, showInfo()) are covered.
const sidebarTip = document.createElement('div');
sidebarTip.className = 'vis-tooltip';
sidebarTip.style.cssText = 'white-space: normal; max-width: 360px; overflow-wrap: break-word;';
document.body.appendChild(sidebarTip);
let sidebarTipTimer = null;
let sidebarTipEl = null;    // element whose text the tooltip shows
let sidebarTipZone = null;  // element the pointer must leave to hide it
function hideSidebarTip() {
  clearTimeout(sidebarTipTimer);
  sidebarTip.style.visibility = 'hidden';
  sidebarTip.textContent = '';
  sidebarTipEl = sidebarTipZone = null;
}
document.addEventListener('mouseover', e => {
  const zone = e.target.closest && e.target.closest('.legend-count, .legend-item, .search-item, .neighbor-link');
  // Anywhere on a legend row except its count (dot, checkbox, gaps, padding)
  // stands for the row's name, so moving within the row never re-triggers it.
  const el = zone && zone.classList.contains('legend-item') ? zone.querySelector('.legend-label') : zone;
  if (!el || el === sidebarTipEl) return;
  hideSidebarTip();
  const isCount = el.classList.contains('legend-count');
  if (!isCount && el.scrollWidth <= el.clientWidth) return;
  const text = isCount ? `${el.textContent} ${el.textContent === '1' ? 'node' : 'nodes'}` : el.textContent;
  sidebarTipEl = el;
  sidebarTipZone = zone;
  const x = e.clientX, y = e.clientY;
  sidebarTipTimer = setTimeout(() => {
    sidebarTip.textContent = text;
    sidebarTip.style.left = sidebarTip.style.top = '0px';  // measure at full max-width
    sidebarTip.style.visibility = 'visible';
    const w = sidebarTip.offsetWidth, h = sidebarTip.offsetHeight;
    sidebarTip.style.left = Math.max(4, Math.min(x + 12, window.innerWidth - w - 4)) + 'px';
    sidebarTip.style.top = (y + 16 + h > window.innerHeight ? Math.max(4, y - h - 8) : y + 16) + 'px';
  }, 100);
});
document.addEventListener('mouseout', e => {
  if (sidebarTipZone && !sidebarTipZone.contains(e.relatedTarget)) hideSidebarTip();
});
// A click rebuilds or hides the row (showInfo(), search pick) without a mouseout.
document.addEventListener('mousedown', hideSidebarTip);

// Track hovered node — hover detection is more reliable than click params
let hoveredNodeId = null;
network.on('hoverNode', params => {

network.on('blurNode', () => {

container.addEventListener('click', () => {

network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);

    document.getElementById('info-content').innerHTML = '<span class="empty">노드를 누르면 여기에 나옵니다</span>';

});

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const hiddenCommunities = new Set();

const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  updateSelectAllState();
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});
</script>

// afterDrawing passes ctx already transformed to network coordinate space.
// Draw node positions raw — no manual pan/zoom/DPR math needed.

// Andrew's monotone chain. Returns the hull in counter-clockwise order, which
// is what the perimeter must be traced in. Collinear and duplicate points
// collapse to the extremes, so degenerate member sets render as a segment
// rather than a zero-area crossed path.
function convexHull(pts) {
    const p = pts.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
    if (p.length < 3) return p;
    const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
    const build = seq => {
        const out = [];
        for (const q of seq) {
            while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], q) <= 0) out.pop();
            out.push(q);
        }
        out.pop();
        return out;
    };
    const hull = build(p).concat(build(p.slice().reverse()));
    return hull.length >= 3 ? hull : p;
}
network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates.
        // The perimeter must follow hull order, not h.nodes order: tracing the
        // raw member order self-intersects whenever the layout does not happen
        // to place members in angular order, filling as crossed wedges.
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const hull = convexHull(positions);
        const expanded = hull.map(p => ({
            x: cx + (p.x - cx) * 1.15,
            y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
});
